name: Documentation and privacy checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-and-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documentation links and required files
        run: python3 tools/check_docs.py .
      - name: Reject raw EFI and common accidental secrets
        run: python3 tools/check_share_safety.py .
